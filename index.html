<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Трекер и Планировщик</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-color); color: var(--text); padding-bottom: 80px; user-select: none; }
    
    .header { padding: 16px; background: var(--card-bg); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 18px; font-weight: 700; color: var(--text); }
    .subtitle { font-size: 12px; color: var(--text-muted); }

    .date-navigator { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; }
    .date-btn { background: var(--border); color: var(--text); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .current-date-title { font-weight: 600; font-size: 14px; }

    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); display: flex; border-top: 1px solid var(--border); z-index: 100; }
    .nav-btn { flex: 1; padding: 12px 0; text-align: center; color: var(--text-muted); font-size: 11px; cursor: pointer; border: none; background: none; }
    .nav-btn.active { color: var(--accent); font-weight: 600; }

    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: var(--card-bg); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    .progress-bar-bg { background: var(--border); height: 8px; border-radius: 4px; overflow: hidden; margin: 10px 0; }
    .progress-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }

    .task-list, .habit-list { list-style: none; }
    .task-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 8px; margin-bottom: 8px; gap: 8px; }
    .task-item.completed span { text-decoration: line-through; color: var(--text-muted); }
    .task-info { display: flex; align-items: center; gap: 8px; flex: 1; }

    .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: 600; }
    .badge-work { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .badge-study { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
    .badge-personal { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-health { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }

    .priority-high { border-left: 3px solid var(--danger); }
    .priority-medium { border-left: 3px solid var(--warning); }
    .priority-low { border-left: 3px solid var(--success); }

    input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
    
    .add-form { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .form-row { display: flex; gap: 8px; }
    .input-field, .select-field { padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text); outline: none; font-size: 13px; }
    .input-field { flex: 1; }
    .btn { padding: 10px 16px; background: var(--accent); border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; }
    .btn-delete { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 14px; padding: 0 4px; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>Планировщик и Дисциплина</h1>
      <div class="subtitle">Планирование дня, недели и месяца</div>
    </div>
  </div>

  <div class="container">
    
    <!-- ВКЛАДКА "ДЕНЬ" -->
    <div id="tab-day" class="tab-content active">
      <div class="date-navigator">
        <button class="date-btn" onclick="changeDate(-1)">← Вчера</button>
        <span class="current-date-title" id="selected-date-display">Сегодня</span>
        <button class="date-btn" onclick="changeDate(1)">Завтра →</button>
      </div>

      <div class="card">
        <div class="card-title">Прогресс выбранного дня <span id="progress-text">0%</span></div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Задачи на день</div>
        <ul class="task-list" id="day-tasks-list"></ul>

        <form class="add-form" id="add-task-form">
          <input type="text" class="input-field" id="new-task-text" placeholder="Описание задачи..." required>
          <div class="form-row">
            <select class="select-field" id="new-task-category">
              <option value="work">Работа</option>
              <option value="study">Учёба</option>
              <option value="personal">Личное</option>
              <option value="health">Здоровье</option>
            </select>
            <select class="select-field" id="new-task-priority">
              <option value="low">Низкий приоритет</option>
              <option value="medium" selected>Средний приоритет</option>
              <option value="high">Высокий приоритет</option>
            </select>
            <button type="submit" class="btn" style="flex:1;">Добавить</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ВКЛАДКА "ОБЗОР (НЕДЕЛЯ / МЕСЯЦ)" -->
    <div id="tab-overview" class="tab-content">
      <div class="card">
        <div class="card-title">Быстрое планирование на будущие даты</div>
        <form class="add-form" id="future-task-form">
          <input type="date" class="input-field" id="future-date-input" required>
          <input type="text" class="input-field" id="future-task-text" placeholder="Запланировать задачу..." required>
          <div class="form-row">
            <select class="select-field" id="future-task-category">
              <option value="work">Работа</option>
              <option value="study">Учёба</option>
              <option value="personal">Личное</option>
              <option value="health">Здоровье</option>
            </select>
            <button type="submit" class="btn" style="flex:1;">Запланировать</button>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="card-title">Предстоящие задачи</div>
        <ul class="task-list" id="upcoming-tasks-list"></ul>
      </div>
    </div>

    <!-- ВКЛАДКА "ПРИВЫЧКИ" -->
    <div id="tab-habits" class="tab-content">
      <div class="card">
        <div class="card-title">Ежедневные привычки</div>
        <ul class="task-list" id="habit-list"></ul>
        <form class="add-form" id="add-habit-form" style="flex-direction:row;">
          <input type="text" class="input-field" id="new-habit-input" placeholder="Новая привычка..." required>
          <button type="submit" class="btn">+</button>
        </form>
      </div>
    </div>

  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="switchTab('day')">День</button>
    <button class="nav-btn" onclick="switchTab('overview')">Обзор / План</button>
    <button class="nav-btn" onclick="switchTab('habits')">Привычки</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let currentDate = new Date();

    let state = JSON.parse(localStorage.getItem('appPlannerState')) || {
      tasks: {}, // { "YYYY-MM-DD": [ { id, text, category, priority, done } ] }
      habits: [
        { id: 1, name: 'Зарядка / Спорт', doneToday: false },
        { id: 2, name: 'Чтение 15 минут', doneToday: false }
      ]
    };

    function saveState() {
      localStorage.setItem('appPlannerState', JSON.stringify(state));
      render();
    }

    function formatDateKey(date) {
      return date.toISOString().split('T')[0];
    }

    function changeDate(days) {
      currentDate.setDate(currentDate.getDate() + days);
      render();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    function getCategoryBadge(cat) {
      const names = { work: 'Работа', study: 'Учёба', personal: 'Личное', health: 'Здоровье' };
      return `<span class="badge badge-${cat}">${names[cat] || cat}</span>`;
    }

    function render() {
      const dateKey = formatDateKey(currentDate);
      const todayKey = formatDateKey(new Date());

      // Отображение даты
      let dateTitle = currentDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', weekday: 'short' });
      if (dateKey === todayKey) dateTitle = 'Сегодня (' + dateTitle + ')';
      document.getElementById('selected-date-display').innerText = dateTitle;

      // Список задач выбранного дня
      const dayTasks = state.tasks[dateKey] || [];
      const dayList = document.getElementById('day-tasks-list');
      dayList.innerHTML = dayTasks.length ? '' : '<li style="color: var(--text-muted); font-size:13px; text-align:center; padding:10px;">Задач на этот день нет</li>';

      let doneCount = 0;
      dayTasks.forEach(task => {
        if (task.done) doneCount++;
        const li = document.createElement('li');
        li.className = `task-item priority-${task.priority} ${task.done ? 'completed' : ''}`;
        li.innerHTML = `
          <div class="task-info">
            <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask('${dateKey}', ${task.id})">
            <span>${task.text}</span>
            ${getCategoryBadge(task.category)}
          </div>
          <button class="btn-delete" onclick="deleteTask('${dateKey}', ${task.id})">✕</button>
        `;
        dayList.appendChild(li);
      });

      const progress = dayTasks.length ? Math.round((doneCount / dayTasks.length) * 100) : 0;
      document.getElementById('progress-fill').style.width = progress + '%';
      document.getElementById('progress-text').innerText = progress + '%';

      // Список предстоящих задач (Вкладка "Обзор")
      const upcomingList = document.getElementById('upcoming-tasks-list');
      upcomingList.innerHTML = '';
      const sortedDates = Object.keys(state.tasks).filter(d => d >= todayKey).sort();

      if (sortedDates.length === 0) {
        upcomingList.innerHTML = '<li style="color: var(--text-muted); font-size:13px; text-align:center; padding:10px;">Нет запланированных задач</li>';
      } else {
        sortedDates.forEach(d => {
          state.tasks[d].forEach(task => {
            const li = document.createElement('li');
            li.className = `task-item priority-${task.priority} ${task.done ? 'completed' : ''}`;
            li.innerHTML = `
              <div class="task-info">
                <span style="font-size:11px; color:var(--accent); font-weight:600;">${d}</span>
                <span>${task.text}</span>
                ${getCategoryBadge(task.category)}
              </div>
              <button class="btn-delete" onclick="deleteTask('${d}', ${task.id})">✕</button>
            `;
            upcomingList.appendChild(li);
          });
        });
      }

      // Список привычек
      const habitList = document.getElementById('habit-list');
      habitList.innerHTML = '';
      state.habits.forEach(h => {
        const li = document.createElement('li');
        li.className = 'task-item';
        li.innerHTML = `
          <span>${h.name}</span>
          <input type="checkbox" ${h.doneToday ? 'checked' : ''} onchange="toggleHabit(${h.id})">
        `;
        habitList.appendChild(li);
      });
    }

    function toggleTask(dateKey, id) {
      const task = state.tasks[dateKey]?.find(t => t.id === id);
      if (task) task.done = !task.done;
      saveState();
    }

    function deleteTask(dateKey, id) {
      if (state.tasks[dateKey]) {
        state.tasks[dateKey] = state.tasks[dateKey].filter(t => t.id !== id);
        if (state.tasks[dateKey].length === 0) delete state.tasks[dateKey];
        saveState();
      }
    }

    function addTaskForDate(dateKey, text, category, priority) {
      if (!state.tasks[dateKey]) state.tasks[dateKey] = [];
      state.tasks[dateKey].push({ id: Date.now(), text, category, priority, done: false });
      saveState();
    }

    function toggleHabit(id) {
      const h = state.habits.find(item => item.id === id);
      if (h) h.doneToday = !h.doneToday;
      saveState();
    }

    document.getElementById('add-task-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = document.getElementById('new-task-text').value.trim();
      const cat = document.getElementById('new-task-category').value;
      const prio = document.getElementById('new-task-priority').value;
      if (text) {
        addTaskForDate(formatDateKey(currentDate), text, cat, prio);
        document.getElementById('new-task-text').value = '';
      }
    });

    document.getElementById('future-task-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const dateVal = document.getElementById('future-date-input').value;
      const text = document.getElementById('future-task-text').value.trim();
      const cat = document.getElementById('future-task-category').value;
      if (dateVal && text) {
        addTaskForDate(dateVal, text, cat, 'medium');
        document.getElementById('future-task-text').value = '';
        alert('Задача успешно запланирована на ' + dateVal);
      }
    });

    document.getElementById('add-habit-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('new-habit-input');
      if (input.value.trim()) {
        state.habits.push({ id: Date.now(), name: input.value.trim(), doneToday: false });
        input.value = '';
        saveState();
      }
    });

    document.getElementById('future-date-input').value = formatDateKey(new Date());
    render();
  </script>
</body>
</html>
